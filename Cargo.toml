[package]
name = "hspz"
authors = ["Alejandro Gonzales-Irribarren <alejandrxgzi@gmail.com>"]
version = "0.1.2"
edition = "2024"
license = "GPL-3.0"
description = "GPU-accelerated high-scoring ungapped alignment pair backend"
repository = "https://github.com/hillerlab/hspZ"
homepage = "https://hillerlab.github.io/hspZ/"
readme = "README.md"
keywords = ["bioinformatics", "assembly", "genome", "alignment"]

[workspace]

[[bin]]
name = "hspZ"
path = "src/main.rs"

[dependencies]
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide.git" }
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git" }
cuda-host = { git = "https://github.com/NVlabs/cuda-oxide.git" }
clap = { version = "4", features = ["derive"] }
memchr = "2"
flate2 = "1"
twobit = "0.2.2"
tar = "0.4.46"

[features]
default = ["simd-prelude", "find-hits-warp", "ref-loc-buckets", "gate-int-keep", "gate-payload-ballot", "gate-sieve", "find-hits-groups"]

# Benchmark-only find_hsps counters. Never time a build with this
# on — per-hit stores and per-tile increments shift register pressure.
counters = []

# Native-NVIDIA validation variants. The default build is always production
# behaviour; these are opt-in and meant to be enabled one at a time, each into its
# own target dir. Every one of them lost or was unreachable under ZLUDA, so none is
# a production change.
#
# Drop the two proven-dead bounds checks in find_num_hits (ZLUDA: +0.7%).
nvidia-find-num-unchecked = []
# Skip the dead memsets on d_seeds/d_hit_num (ZLUDA: stage win, run noise).
nvidia-uninit-seed-buffers = []

# Generate the stable query seed stream on the device. The check variant copies
# it back and compares every u64 against the CPU oracle. The seeding path is
# chosen at *runtime* on the worker count, so this no longer gates it — both
# paths are always compiled. Kept because `device-seeds-check` depends on it and
# to keep older invocations building.
device-seeds = []
device-seeds-check = ["device-seeds"]

# Reject low-scoring hits inside find_hsps with the existing warp-coalesced
# access pattern before running the full materializer.
warp-score-gate = []

# Store 8-byte anchors, compact score-gate survivors in stable hit order, and
# run the unchanged materializer only on that dense list.
dense-anchors = ["warp-score-gate"]

# One warp owns each seed's dense anchor walk when the launch has at least
# 8 hits/seed (16 before 0.0.5); sparse launches keep thread-per-seed. Default.
find-hits-warp = ["dense-anchors"]

# Round 83-87: between find_hits and the score gate, stably reorder a chunk's anchors
# into reference-address buckets so consecutive warps of the gate gather from an
# L2-resident reference window. Output stays byte-identical. Default; at runtime
# `HSPZ_REF_BUCKETS=auto` (unset) measures both paths per engine and keeps the faster.
ref-loc-buckets = ["dense-anchors"]

# Score the first 64 left bases as 32 adjacent pairs.
left-pair-tile = ["dense-anchors"]

# Score 32 right + 64 left as packed 4-base groups in one warp
# (lanes 0-7 / 8-23), width-8 and width-16 scans.
simd-prelude = ["left-pair-tile"]

# Score-gate instruction diet. Both are byte-identical and default. L4, unit 0
# of hg38 x mm39 at W=1, reversed arms, output digest unchanged: with the
# reference-bucketed gate kernel gate-int-keep alone takes the score gate -6.5%
# and both together -30.1% (wall -25.3%); with the plain kernel both together
# take it -25.9% (wall -23.4%).
#
# Lane 0's keep compares `total >= t_min` in integers instead of rounding
# through f32 and f64; the host computes t_min = keep_threshold(hspthresh) once
# per engine. find_hsps keeps its own f32 threshold.
gate-int-keep = []
# The SIMD prelude's first-drop recovery from one payload ballot (each lane
# offers its maximum before its own first drop) instead of four ballots, the
# first-of decodes, the min cascades and the recover branches.
gate-payload-ballot = ["simd-prelude"]

# The score-gate sieve (`gpu/sieve.rs`). In front of the exact score gate each
# lane bounds the score of its own hit from 2-bit packed sequence, and the warp
# scores only the hits whose bound reaches the threshold or could not be
# certified. A rejected hit has an exact score below the threshold, so the
# output is byte-identical. Default since 0.1.0. Unit 0 of hg38 x mm39 at W=1,
# reversed arms, output digest unchanged: A100 score gate 71.0 -> 16.0 s and
# wall 85.4 -> 28.8 s; L4 score gate 120.8 -> 14.9 s and wall 156.2 -> 51.7 s.
# Whole hg38 x mm39 on one A100: 3,492 -> 773 s, the same bytes (with the
# bucket pass sized for the packed planes, see `ref-loc-buckets`).
# At runtime `HSPZ_GATE_SIEVE=0` keeps the plain gate kernels, and `=gather` or
# `=auto` load the reference groups through shared memory, which is faster where
# memory bandwidth binds (an L4 without its bucket pass).
gate-sieve = ["dense-anchors", "gate-int-keep", "ref-loc-buckets"]
# `find_hits` with one warp per run of 32 consecutive seeds, its lanes spread
# over the run's hits, instead of one warp per seed; each seed's first position
# index comes from a buffer `find_num_hits_lo` writes, not from a second read of
# the index table. Four rounds of 32 hits go through the loop together, so a
# warp has four position loads in flight. The same anchors in the same order.
# `HSPZ_FIND_HITS_GROUPS=0` restores one warp (or thread) per seed, `=check`
# runs both and compares every anchor. A100, hg38 x mm39: find_hits 2,900 ->
# 1,515 ms on unit 0.
find-hits-groups = ["dense-anchors"]

[profile.release]
# `debug = 1` used to live here; `strip = true` discards it immediately, so it only cost
# build time (70 s -> 43 s once removed). The two container integrity gates do not need it:
# `strings` finds the embedded PTX in .rodata and `nm -D` reads .dynsym, and a stripped
# binary keeps both. Trade-off accepted with `strip = true`: panic backtraces have no
# symbol names. `strip = "debuginfo"` keeps them for +308 KB if that is ever wanted.
lto = true
opt-level = 3
codegen-units = 1
strip = true
